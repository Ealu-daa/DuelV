<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>DuelV</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">

  <!-- Firebase SDK (compat版。jslib内のfirebase.xxx記法がそのまま使える) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #unity-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
  </div>
  <script src="Build/b.1.loader.js"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");

    // 実解像度をウィンドウサイズに追従させる(見た目だけCSSで伸ばすとぼやけるため)
    function resizeCanvas() {
      var dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/b.1.data",
      frameworkUrl: buildUrl + "/b.1.framework.js",
      codeUrl: buildUrl + "/b.1.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "DuelV",
      productVersion: "b.1",
    };

    createUnityInstance(canvas, config).then((unityInstance) => {
      window.unityInstance = unityInstance;
    });
  </script>
</body>
</html>
