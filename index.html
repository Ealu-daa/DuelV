<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>DuelV</title>
  <link rel="icon" type="image/png" href="TemplateData/favicon.png">

  <!-- Firebase SDK (compat版。jslib内のfirebase.xxx記法がそのまま使える) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    /* スマホを縦持ちした時に、ゲーム部分だけを90度回転させて強制的に横向き表示にする(OSの回転ロックが
       かかっていても効く)。bodyには絶対にtransformをかけない: Google Identity Services等がdocument.body
       直下にposition:fixedでUIを差し込んでくることがあり、body自体を回転させるとそのUIまで巻き込んで
       回転・位置ズレしてしまう(実際にGoogle連携のプロンプトが操作不能になる不具合が起きた)。
       そのため回転は専用ラッパー(#app-root)だけに閉じ込める */
    #app-root {
      width: 100%;
      height: 100%;
    }
    #app-root.force-landscape {
      position: fixed;
      top: 0;
      left: 100%;
      width: 100vh;
      height: 100vw;
      transform-origin: 0 0;
      transform: rotate(90deg);
    }
    #unity-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #fullscreen-button {
      position: fixed;
      right: 12px;
      bottom: 12px;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: none;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 20px;
      line-height: 40px;
      text-align: center;
      padding: 0;
      z-index: 100;
      cursor: pointer;
      /* スマホでタップ時にハイライト色が付くのを防ぐ */
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <div id="app-root">
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>
    </div>
    <button id="fullscreen-button" type="button" aria-label="フルスクリーン切り替え">⛶</button>
  </div>
  <script src="Build/a.1.loader.js"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var unityContainer = document.getElementById("unity-container");

    // 常に16:9を維持し、ウィンドウ/画面がその比率でない場合は収まる最大サイズでレターボックス(上下 or 左右に黒帯)する。
    // #unity-containerがflexで中央揃えなので、キャンバスのCSSサイズをこの矩形に固定するだけで自動的に中央に収まる
    var TARGET_ASPECT = 16 / 9;

    function isTouchDevice() {
      return ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
    }

    var appRoot = document.getElementById("app-root");

    // スマホ(タッチデバイス)を縦持ちしている間だけ、#app-rootに.force-landscapeを付けてCSSで90度回転させる
    // (bodyそのものは回転させない。理由は#app-root.force-landscapeのコメント参照)。
    // OSの画面回転ロックがかかっていても効く(ネイティブのScreen Orientation APIに頼らないため)
    function updateForceLandscape() {
      var shouldRotate = isTouchDevice() && window.innerHeight > window.innerWidth;
      appRoot.classList.toggle("force-landscape", shouldRotate);
    }

    function resizeCanvas() {
      var dpr = window.devicePixelRatio || 1;
      // 回転中は#app-root自体がwidth/heightを入れ替えているので、実際に使える見た目の横/縦もそれに合わせて入れ替える
      var rotated = appRoot.classList.contains("force-landscape");
      var winW = rotated ? window.innerHeight : window.innerWidth;
      var winH = rotated ? window.innerWidth : window.innerHeight;

      var w = winW;
      var h = w / TARGET_ASPECT;
      if (h > winH) {
        h = winH;
        w = h * TARGET_ASPECT;
      }

      // 実解像度(canvas.width/height)とCSS表示サイズ(canvas.style)を両方この矩形に合わせる
      // (表示サイズだけCSSで伸ばすとぼやけるため、実解像度側もdpr込みで明示的に指定する)
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      canvas.width = w * dpr;
      canvas.height = h * dpr;
    }

    function handleViewportChange() {
      updateForceLandscape();
      resizeCanvas();
    }
    handleViewportChange();
    window.addEventListener("resize", handleViewportChange);
    window.addEventListener("orientationchange", handleViewportChange);
    // モバイルブラウザはアドレスバーの表示/非表示などでビューポートの確定が初回描画に間に合わないことがあり、
    // その場合resize/orientationchangeが発火しないまま「縦横判定はforce-landscapeなのに、実解像度の計算だけ
    // 古い(縦の)ウィンドウサイズを元にしたまま」になってしまう不具合が実際にあった(CSSの回転自体は効いて
    // いるのに、中身の描画だけ潰れて縦のまま見える)。次の数フレーム/数百ms以内に再計算して自己修復させておく
    requestAnimationFrame(function () {
      requestAnimationFrame(handleViewportChange);
    });
    setTimeout(handleViewportChange, 300);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", handleViewportChange);

    // フルスクリーン切り替え(ブラウザの仕様上、ユーザー操作がないと呼び出せないためボタン経由にしている)。
    // ベンダープレフィックス付きAPI(Safari等)にも対応。
    // 対象は#unity-containerではなくページ全体(<html>)にしている: Fullscreen APIは指定した要素の子孫しか
    // 表示しないため、#unity-containerを対象にすると、document.body直下に追加されるGoogle連携ボタンの
    // オーバーレイ(GoogleSignIn.jslib参照)やこのフルスクリーンボタン自体がフルスクリーン中に見えなくなる。
    // document.documentElementを対象にすればbody配下も表示対象に含まれるので、この問題が起きない
    // (回転処理は#app-rootだけにかかる独立した仕組みなので、対象をhtmlに変えても影響はない)。
    var fullscreenTarget = document.documentElement;
    var fullscreenButton = document.getElementById("fullscreen-button");

    function isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    }

    function requestFullscreen(el) {
      if (el.requestFullscreen) return el.requestFullscreen();
      if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen(); // Safari
      if (el.msRequestFullscreen) return el.msRequestFullscreen();         // 旧Edge/IE
    }

    function exitFullscreen() {
      if (document.exitFullscreen) return document.exitFullscreen();
      if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
      if (document.msExitFullscreen) return document.msExitFullscreen();
    }

    if (fullscreenButton) {
      // iOS Safari(特に旧バージョン)はFullscreen API自体に対応していない場合があるため、
      // 非対応環境ではボタンごと隠す
      var supportsFullscreen = !!(fullscreenTarget.requestFullscreen || fullscreenTarget.webkitRequestFullscreen || fullscreenTarget.msRequestFullscreen);
      if (!supportsFullscreen) {
        fullscreenButton.style.display = "none";
      } else {
        fullscreenButton.addEventListener("click", function () {
          if (isFullscreen()) {
            exitFullscreen();
          } else {
            var result = requestFullscreen(fullscreenTarget);
            // 対応環境(主にAndroid Chrome)ではフルスクリーン化と同時にOS側の回転ロックも試みる。
            // 失敗/非対応でも.force-landscapeによるCSS回転が効くので無視してよい
            if (result && result.then) {
              result.then(function () {
                if (screen.orientation && screen.orientation.lock) {
                  screen.orientation.lock("landscape").catch(function () {});
                }
              });
            }
          }
        });

        var updateButtonLabel = function () {
          fullscreenButton.textContent = isFullscreen() ? "⤢" : "⛶";
        };
        document.addEventListener("fullscreenchange", updateButtonLabel);
        document.addEventListener("webkitfullscreenchange", updateButtonLabel);
        document.addEventListener("msfullscreenchange", updateButtonLabel);
      }
    }

    // ウィンドウモード限定の画面サイズ調整(50~150%、デフォルト100%、ピボットは中心)。
    // 設定画面のスライダーからUnity側(WindowScaleSettings.cs → WindowScale.jslib)経由で
    // window.__duelvSetGameWindowScalePercentが呼ばれ、ここで実際にCSSのtransform:scaleとして適用する。
    // フルスクリーンは画面いっぱいに表示する機能で、この設定と組み合わせる意味がないため、
    // フルスクリーン中は常に100%(等倍)として扱い、ウィンドウモードに戻ったら元の設定値を再適用する。
    // #fullscreen-buttonまで縮小/拡大されるとタップしづらくなるので、対象は#unity-containerだけにする
    // (transform-origin:center centerなので、常に画面中央を基準に拡大縮小される)。
    var gameWindowScalePercent = 100;
    unityContainer.style.transformOrigin = "center center";

    function applyGameWindowScale() {
      var percent = isFullscreen() ? 100 : gameWindowScalePercent;
      unityContainer.style.transform = percent === 100 ? "" : "scale(" + (percent / 100) + ")";
    }

    document.addEventListener("fullscreenchange", applyGameWindowScale);
    document.addEventListener("webkitfullscreenchange", applyGameWindowScale);
    document.addEventListener("msfullscreenchange", applyGameWindowScale);

    // Unity(WindowScale.jslib)から呼ばれるエントリーポイント
    window.__duelvSetGameWindowScalePercent = function (percent) {
      gameWindowScalePercent = percent;
      applyGameWindowScale();
    };

    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/a.1.data.unityweb",
      frameworkUrl: buildUrl + "/a.1.framework.js.unityweb",
      codeUrl: buildUrl + "/a.1.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "DuelV",
      productVersion: "a.1",
    };

    createUnityInstance(canvas, config).then((unityInstance) => {
      window.unityInstance = unityInstance;
      handleViewportChange(); // 起動完了後、念のためもう一度サイズ/向きを確定させる(上のセルフヒール参照)
    });
  </script>
</body>
</html>
