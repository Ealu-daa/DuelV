<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>DuelV</title>
  <link rel="icon" type="image/png" href="TemplateData/favicon.png">

  <!-- Firebase SDK (compat版。jslib内のfirebase.xxx記法がそのまま使える) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    /* スマホを縦持ちした時に、ゲーム部分だけを90度回転させて強制的に横向き表示にする(OSの回転ロックが
       かかっていても効く)。bodyには絶対にtransformをかけない: Google Identity Services等がdocument.body
       直下にposition:fixedでUIを差し込んでくることがあり、body自体を回転させるとそのUIまで巻き込んで
       回転・位置ズレしてしまう(実際にGoogle連携のプロンプトが操作不能になる不具合が起きた)。
       そのため回転は専用ラッパー(#app-root)だけに閉じ込める */
    #app-root {
      width: 100%;
      height: 100%;
    }
    #app-root.force-landscape {
      position: fixed;
      top: 0;
      left: 100%;
      width: 100vh;
      height: 100vw;
      transform-origin: 0 0;
      transform: rotate(90deg);
    }
    #unity-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #fullscreen-button,
    #rotate-button {
      position: fixed;
      bottom: 12px;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: none;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 20px;
      line-height: 40px;
      text-align: center;
      padding: 0;
      z-index: 100;
      cursor: pointer;
      /* スマホでタップ時にハイライト色が付くのを防ぐ */
      -webkit-tap-highlight-color: transparent;
    }
    #fullscreen-button { right: 12px; }
    #rotate-button { right: 60px; }
    /* 手動で回転をONにしている間、押しっぱなし感を出す */
    #rotate-button.active {
      background: rgba(255, 255, 255, 0.85);
      color: #000;
    }
  </style>
</head>
<body>
  <div id="app-root">
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>
    </div>
    <button id="fullscreen-button" type="button" aria-label="フルスクリーン切り替え">⛶</button>
    <button id="rotate-button" type="button" aria-label="回転切り替え">↻</button>
  </div>
  <script src="Build/a.1.loader.js"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var unityContainer = document.getElementById("unity-container");

    // ウィンドウモード限定の画面サイズ調整(50~150%、デフォルト100%)。設定画面のスライダーから
    // window.__duelvSetGameWindowScalePercent(下の方で定義)経由で更新される。
    // resizeCanvas()が最初に呼ばれるより前にここで初期化しておくこと(varは巻き上げられても代入は
    // されないので、ここで初期化しないと初回のresizeCanvas()でNaNになってしまう)
    var gameWindowScalePercent = 100;

    // 常に16:9を維持し、ウィンドウ/画面がその比率でない場合は収まる最大サイズでレターボックス(上下 or 左右に黒帯)する。
    // #unity-containerがflexで中央揃えなので、キャンバスのCSSサイズをこの矩形に固定するだけで自動的に中央に収まる
    var TARGET_ASPECT = 16 / 9;

    function isTouchDevice() {
      return ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
    }

    var appRoot = document.getElementById("app-root");
    var rotateButton = document.getElementById("rotate-button");

    // 回転ボタンで手動固定した状態(null=自動判定に従う、true/false=ユーザーが手動でON/OFF固定した)。
    // 自動判定(isTouchDevice() && 縦長)だけだと、判定に引っかからない環境(例: タッチ対応と判定されない
    // デスクトップ)で回転を試したい場合や、逆に自動でONになった回転を一時的に解除したい場合に対応できない
    // ため、フルスクリーンボタンと同様に手動トグルできるボタンを用意している
    var manualRotationOverride = null;

    // スマホ(タッチデバイス)を縦持ちしている間だけ、#app-rootに.force-landscapeを付けてCSSで90度回転させる
    // (bodyそのものは回転させない。理由は#app-root.force-landscapeのコメント参照)。
    // OSの画面回転ロックがかかっていても効く(ネイティブのScreen Orientation APIに頼らないため)
    function updateForceLandscape() {
      var autoShouldRotate = isTouchDevice() && window.innerHeight > window.innerWidth;
      var shouldRotate = manualRotationOverride !== null ? manualRotationOverride : autoShouldRotate;
      appRoot.classList.toggle("force-landscape", shouldRotate);
      if (rotateButton) rotateButton.classList.toggle("active", shouldRotate);
    }

    if (rotateButton) {
      rotateButton.addEventListener("click", function () {
        manualRotationOverride = !appRoot.classList.contains("force-landscape");
        handleViewportChange();
      });
    }

    function resizeCanvas() {
      var dpr = window.devicePixelRatio || 1;
      // 回転中は#app-root自体がwidth/heightを入れ替えているので、実際に使える見た目の横/縦もそれに合わせて入れ替える
      var rotated = appRoot.classList.contains("force-landscape");
      var winW = rotated ? window.innerHeight : window.innerWidth;
      var winH = rotated ? window.innerWidth : window.innerHeight;

      var w = winW;
      var h = w / TARGET_ASPECT;
      if (h > winH) {
        h = winH;
        w = h * TARGET_ASPECT;
      }

      // ウィンドウモード限定の画面サイズ調整(50~150%、ピボットは中心)。フルスクリーン中、および
      // スマホの強制横向き(rotated)中は常に100%扱いにする。
      // フルスクリーンは画面いっぱいに表示する機能なので、この設定と組み合わせる意味がないため。
      // 強制横向き中は、下のoverflow/padding計算がCSSの見た目の(rotateで90度回転した)座標系ではなく
      // rotate前の論理的な横/縦(winW/winH)を基準にしているため、そのまま適用すると縦横が食い違って
      // 想定外の範囲が見えたりレイアウトが崩れたりする不具合になる。スマホでは元々この設定は意味を
      // 持たない(「ウィンドウモード」はPCブラウザの概念なので)ため、素直に無効化しておく
      var scale = (isFullscreen() || rotated) ? 1 : gameWindowScalePercent / 100;
      var scaledW = w * scale;
      var scaledH = h * scale;

      // 100%より拡大すると#unity-container(flexで中央揃え)からはみ出す分を計算し、同じ量だけ
      // #unity-container自身にpaddingとして持たせる。
      // 理由: flexのjustify-content:centerで中央寄せしたままはみ出させると、CSSの仕様上
      // 「中心から見て手前側(左/上)」のはみ出しはスクロールしても絶対に辿り着けない(scrollLeft/Topは
      // 負の値にできないため)。paddingで同じ分の余白を外側に確保しておくと、はみ出し分がちょうど
      // #unity-container自身の外接ボックスに収まる形になり、祖先(body)から見て「はみ出し」ではなく
      // 通常の(スクロールで届く)サイズとして扱われるようになる
      var overflowX = Math.max(0, scaledW - winW);
      var overflowY = Math.max(0, scaledH - winH);
      unityContainer.style.padding = (overflowY / 2) + "px " + (overflowX / 2) + "px";

      // 実際にはみ出す場合だけスクロール可能にする(それ以外・フルスクリーン中は従来通りoverflow:hiddenのまま)。
      // html側にもCSSで明示的にoverflow:hiddenを指定しているため、bodyだけでなくhtml(documentElement)
      // 側も一緒に切り替えないとクリップされたまま実際にはみ出た部分が見えない(スクロールもできない)
      var isOverflowing = overflowX > 0 || overflowY > 0;
      var overflowValue = isOverflowing ? "auto" : "hidden";
      document.documentElement.style.overflow = overflowValue;
      document.body.style.overflow = overflowValue;

      // 実解像度(canvas.width/height)とCSS表示サイズ(canvas.style)を両方この矩形に合わせる
      // (表示サイズだけCSSで伸ばすとぼやけるため、実解像度側もdpr込みで明示的に指定する)
      canvas.style.width = scaledW + "px";
      canvas.style.height = scaledH + "px";
      canvas.width = scaledW * dpr;
      canvas.height = scaledH * dpr;

      // はみ出している場合、デフォルトでは「はみ出し量の中心」がちょうど画面に収まる位置までスクロール
      // させておく(でないと上のpaddingトリックにより初期スクロール位置(0,0)では左上に寄って見えてしまう)
      if (isOverflowing) {
        document.body.scrollLeft = overflowX / 2;
        document.body.scrollTop = overflowY / 2;
      }
    }

    function handleViewportChange() {
      updateForceLandscape();
      resizeCanvas();
    }
    handleViewportChange();
    window.addEventListener("resize", handleViewportChange);
    window.addEventListener("orientationchange", handleViewportChange);
    // モバイルブラウザはアドレスバーの表示/非表示などでビューポートの確定が初回描画に間に合わないことがあり、
    // その場合resize/orientationchangeが発火しないまま「縦横判定はforce-landscapeなのに、実解像度の計算だけ
    // 古い(縦の)ウィンドウサイズを元にしたまま」になってしまう不具合が実際にあった(CSSの回転自体は効いて
    // いるのに、中身の描画だけ潰れて縦のまま見える)。次の数フレーム/数百ms以内に再計算して自己修復させておく
    requestAnimationFrame(function () {
      requestAnimationFrame(handleViewportChange);
    });
    setTimeout(handleViewportChange, 300);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", handleViewportChange);

    // フルスクリーン切り替え(ブラウザの仕様上、ユーザー操作がないと呼び出せないためボタン経由にしている)。
    // ベンダープレフィックス付きAPI(Safari等)にも対応。
    // 対象は#unity-containerではなくページ全体(<html>)にしている: Fullscreen APIは指定した要素の子孫しか
    // 表示しないため、#unity-containerを対象にすると、document.body直下に追加されるGoogle連携ボタンの
    // オーバーレイ(GoogleSignIn.jslib参照)やこのフルスクリーンボタン自体がフルスクリーン中に見えなくなる。
    // document.documentElementを対象にすればbody配下も表示対象に含まれるので、この問題が起きない
    // (回転処理は#app-rootだけにかかる独立した仕組みなので、対象をhtmlに変えても影響はない)。
    var fullscreenTarget = document.documentElement;
    var fullscreenButton = document.getElementById("fullscreen-button");

    function isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    }

    function requestFullscreen(el) {
      if (el.requestFullscreen) return el.requestFullscreen();
      if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen(); // Safari
      if (el.msRequestFullscreen) return el.msRequestFullscreen();         // 旧Edge/IE
    }

    function exitFullscreen() {
      if (document.exitFullscreen) return document.exitFullscreen();
      if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
      if (document.msExitFullscreen) return document.msExitFullscreen();
    }

    if (fullscreenButton) {
      // iOS Safari(特に旧バージョン)はFullscreen API自体に対応していない場合があるため、
      // 非対応環境ではボタンごと隠す
      var supportsFullscreen = !!(fullscreenTarget.requestFullscreen || fullscreenTarget.webkitRequestFullscreen || fullscreenTarget.msRequestFullscreen);
      if (!supportsFullscreen) {
        fullscreenButton.style.display = "none";
      } else {
        fullscreenButton.addEventListener("click", function () {
          if (isFullscreen()) {
            exitFullscreen();
          } else {
            var result = requestFullscreen(fullscreenTarget);
            // 対応環境(主にAndroid Chrome)ではフルスクリーン化と同時にOS側の回転ロックも試みる。
            // 失敗/非対応でも.force-landscapeによるCSS回転が効くので無視してよい
            if (result && result.then) {
              result.then(function () {
                if (screen.orientation && screen.orientation.lock) {
                  screen.orientation.lock("landscape").catch(function () {});
                }
              });
            }
          }
        });

        var updateButtonLabel = function () {
          fullscreenButton.textContent = isFullscreen() ? "⤢" : "⛶";
        };
        document.addEventListener("fullscreenchange", updateButtonLabel);
        document.addEventListener("webkitfullscreenchange", updateButtonLabel);
        document.addEventListener("msfullscreenchange", updateButtonLabel);
      }
    }

    // ウィンドウモード限定の画面サイズ調整(50~150%)の実際の反映は、上のresizeCanvas()内で行っている
    // (gameWindowScalePercentの値はここで更新し、handleViewportChange()で再計算させるだけ)。
    // フルスクリーンの出入りでもキャンバスサイズを再計算し直す(scale=100%への切り替えを反映するため。
    // 多くのブラウザはフルスクリーン切替時にresizeイベントも発火するが、念のため明示的にも呼んでおく)
    document.addEventListener("fullscreenchange", handleViewportChange);
    document.addEventListener("webkitfullscreenchange", handleViewportChange);
    document.addEventListener("msfullscreenchange", handleViewportChange);

    // Unity(WindowScale.jslib)から呼ばれるエントリーポイント
    window.__duelvSetGameWindowScalePercent = function (percent) {
      gameWindowScalePercent = percent;
      handleViewportChange();
      // Unity側もcanvasのクリック/タップ座標をブラウザのresizeイベントを起点に内部キャッシュしている
      // ことがあるため、こちらから直接canvasサイズを変えた後は念のため合成のresizeイベントを投げて
      // Unity側にも再計算のきっかけを与えておく(ボタンの見た目と実際の当たり判定がズレる事故の予防)
      window.dispatchEvent(new Event("resize"));
    };

    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/a.1.data.unityweb",
      frameworkUrl: buildUrl + "/a.1.framework.js.unityweb",
      codeUrl: buildUrl + "/a.1.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "DuelV",
      productVersion: "a.1",
    };

    createUnityInstance(canvas, config).then((unityInstance) => {
      window.unityInstance = unityInstance;
      handleViewportChange(); // 起動完了後、念のためもう一度サイズ/向きを確定させる(上のセルフヒール参照)
    });
  </script>
</body>
</html>
