<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>DuelV</title>
  <link rel="icon" type="image/png" href="TemplateData/favicon.png">

  <!-- Firebase SDK (compat版。jslib内のfirebase.xxx記法がそのまま使える) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <style>
    /* ロード画面の見出し(#loading-title)用フォント。Google Fontsからの外部読み込みではなく、
       ゲーム本体のTMPでも使っているのと同じttf(Assets/Games/Fonts/DotGothic16-Regular.ttf)を
       このテンプレート配下(Fonts/)にコピーして自前でホストしている
       (Unityがビルド時にWebGLTemplateフォルダの中身をまるごとBuild出力にコピーしてくれるため、
       このFonts/フォルダも自動的にビルドへ含まれる) */
    @font-face {
      font-family: 'DotGothic16';
      src: url('Fonts/DotGothic16-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #app-root {
      width: 100%;
      height: 100%;
      position: relative; /* #loading-overlayをこの中に絶対配置で重ねるための基準 */
    }
    /* ダウンロード中(createUnityInstanceのprogressコールバックが進む間)だけ出す独自のロード画面。
       Unity自身の「Made with Unity」スプラッシュはWASM初期化後にcanvas内で表示されるものなので、
       それより手前の「まだ何も表示できない」区間をここでカバーする */
    #loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      transition: opacity 0.4s ease;
    }
    #loading-title {
      color: #fff;
      font-size: 22px;
      letter-spacing: 4px;
      margin-bottom: 20px;
      font-family: 'DotGothic16', sans-serif; /* 読み込み失敗時はsans-serifにフォールバック */
    }
    #loading-bar-bg {
      width: 60%;
      max-width: 360px;
      height: 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }
    #loading-bar-fill {
      width: 0%;
      height: 100%;
      border-radius: 4px;
      background: #fff;
      transition: width 0.2s ease-out;
    }
    #loading-hint {
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      margin-top: 12px;
      font-family: 'DotGothic16', sans-serif;
    }
    #unity-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #fullscreen-button {
      position: fixed;
      right: 12px;
      bottom: 12px;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: none;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 20px;
      line-height: 40px;
      text-align: center;
      padding: 0;
      z-index: 100;
      cursor: pointer;
      /* スマホでタップ時にハイライト色が付くのを防ぐ */
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <div id="app-root">
    <div id="loading-overlay">
      <div id="loading-title">Loading</div>
      <div id="loading-bar-bg"><div id="loading-bar-fill"></div></div>
      <div id="loading-hint">右下のフルスクリーンボタンを押すことを推奨します</div>
    </div>
    <div id="unity-container">
      <canvas id="unity-canvas"></canvas>
    </div>
    <button id="fullscreen-button" type="button" aria-label="フルスクリーン切り替え">⛶</button>
  </div>
  <script src="Build/a.loader.js"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");

    // 常に16:9を維持し、ウィンドウ/画面がその比率でない場合は収まる最大サイズでレターボックス(上下 or 左右に黒帯)する。
    // #unity-containerがflexで中央揃えなので、キャンバスのCSSサイズをこの矩形に固定するだけで自動的に中央に収まる
    var TARGET_ASPECT = 16 / 9;

    // LINEやX、Instagram等のアプリ内ブラウザ(独自のWebView)は、自前のツールバー/UI分だけ
    // window.innerWidth/innerHeightが実際に見えている領域と食い違うことがよくある(ツールバーの
    // 表示/非表示でも正しく更新されないことがある)。window.visualViewportは「実際に見えている
    // 領域」を返すことを目的としたAPIで、こうしたアプリ内ブラウザでもより正確な値が取れることが多いため、
    // 使える場合はそちらを優先する
    function getViewportSize() {
      if (window.visualViewport) {
        return { width: window.visualViewport.width, height: window.visualViewport.height };
      }
      return { width: window.innerWidth, height: window.innerHeight };
    }

    function resizeCanvas() {
      var dpr = window.devicePixelRatio || 1;
      var vp = getViewportSize();
      var winW = vp.width;
      var winH = vp.height;

      var w = winW;
      var h = w / TARGET_ASPECT;
      if (h > winH) {
        h = winH;
        w = h * TARGET_ASPECT;
      }

      // 実解像度(canvas.width/height)とCSS表示サイズ(canvas.style)を両方この矩形に合わせる
      // (表示サイズだけCSSで伸ばすとぼやけるため、実解像度側もdpr込みで明示的に指定する)
      canvas.style.width = w + "px";
      canvas.style.height = h + "px";
      canvas.width = w * dpr;
      canvas.height = h * dpr;
    }
    // WebGLInput.jslib(スマホのテキスト入力用オーバーレイ)から、編集中かどうかに合わせて呼んでもらう。
    // 詳しくは下のhandleViewportResizeのコメント参照
    window.__duelvResizeCanvas = resizeCanvas;

    // モバイルブラウザはアドレスバーの表示/非表示などでビューポートの確定が初回描画に間に合わないことがあり、
    // その場合resize/orientationchangeが発火しないまま古いウィンドウサイズを元にした計算のままになって
    // しまう不具合が実際にあった。次の数フレーム/数百ms以内に再計算して自己修復させておく
    resizeCanvas();

    // ソフトウェアキーボードが開くと、モバイルブラウザは(特にvisualViewportの)高さが縮んだ通常の
    // リサイズと区別せずresizeイベントを発火する。resizeCanvasはそれを「画面が小さくなった」と
    // 解釈してcanvas自体を小さくレターボックスしてしまい、キーボード表示のたびにゲーム画面が
    // 縮んで見える不具合になっていた(実際に報告あり)。WebGLInput.jslib側でテキスト編集中は
    // window.__duelvTextInputActive=trueにしてもらい、その間はここでのcanvas再計算をスキップする
    // (編集終了時はWebGLInput.jslib側からwindow.__duelvResizeCanvas()を直接呼んで即座に正しいサイズへ戻す)
    function handleViewportResize() {
      if (window.__duelvTextInputActive) return;
      resizeCanvas();
    }
    window.addEventListener("resize", handleViewportResize);
    window.addEventListener("orientationchange", handleViewportResize);
    requestAnimationFrame(function () {
      requestAnimationFrame(resizeCanvas);
    });
    setTimeout(resizeCanvas, 300);
    if (window.visualViewport) window.visualViewport.addEventListener("resize", handleViewportResize);

    // フルスクリーン切り替え(ブラウザの仕様上、ユーザー操作がないと呼び出せないためボタン経由にしている)。
    // ベンダープレフィックス付きAPI(Safari等)にも対応。
    // 対象は#unity-containerではなくページ全体(<html>)にしている: Fullscreen APIは指定した要素の子孫しか
    // 表示しないため、#unity-containerを対象にすると、document.body直下に追加されるGoogle連携ボタンの
    // オーバーレイ(GoogleSignIn.jslib参照)やこのフルスクリーンボタン自体がフルスクリーン中に見えなくなる。
    // document.documentElementを対象にすればbody配下も表示対象に含まれるので、この問題が起きない。
    var fullscreenTarget = document.documentElement;
    var fullscreenButton = document.getElementById("fullscreen-button");

    function isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    }

    function requestFullscreen(el) {
      if (el.requestFullscreen) return el.requestFullscreen();
      if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen(); // Safari
      if (el.msRequestFullscreen) return el.msRequestFullscreen();         // 旧Edge/IE
    }

    function exitFullscreen() {
      if (document.exitFullscreen) return document.exitFullscreen();
      if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
      if (document.msExitFullscreen) return document.msExitFullscreen();
    }

    if (fullscreenButton) {
      // iOS Safari(特に旧バージョン)はFullscreen API自体に対応していない場合があるため、
      // 非対応環境ではボタンごと隠す
      var supportsFullscreen = !!(fullscreenTarget.requestFullscreen || fullscreenTarget.webkitRequestFullscreen || fullscreenTarget.msRequestFullscreen);
      if (!supportsFullscreen) {
        fullscreenButton.style.display = "none";
      } else {
        fullscreenButton.addEventListener("click", function () {
          if (isFullscreen()) {
            exitFullscreen();
          } else {
            var result = requestFullscreen(fullscreenTarget);
            // 対応環境(主にAndroid Chrome)ではフルスクリーン化と同時にOS側の回転ロックも試みる
            // (スマホを縦持ちしていても、フルスクリーン中は横向きに固定される)。失敗/非対応でも無視してよい
            if (result && result.then) {
              result.then(function () {
                if (screen.orientation && screen.orientation.lock) {
                  screen.orientation.lock("landscape").catch(function () {});
                }
              });
            }
          }
        });

        var updateButtonLabel = function () {
          fullscreenButton.textContent = isFullscreen() ? "⤢" : "⛶";
        };
        document.addEventListener("fullscreenchange", updateButtonLabel);
        document.addEventListener("webkitfullscreenchange", updateButtonLabel);
        document.addEventListener("msfullscreenchange", updateButtonLabel);
      }
    }

    // フルスクリーンの出入りでもキャンバスサイズを再計算し直す(多くのブラウザはフルスクリーン切替時に
    // resizeイベントも発火するが、念のため明示的にも呼んでおく)
    document.addEventListener("fullscreenchange", resizeCanvas);
    document.addEventListener("webkitfullscreenchange", resizeCanvas);
    document.addEventListener("msfullscreenchange", resizeCanvas);

    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/a.data.unityweb",
      frameworkUrl: buildUrl + "/a.framework.js.unityweb",
      codeUrl: buildUrl + "/a.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DELTA",
      productName: "DuelV",
      productVersion: "a.3",
    };

    // ダウンロード中の進捗(0〜1)をバーに反映し、起動完了したらフェードアウトさせて消す
    var loadingOverlay = document.getElementById("loading-overlay");
    var loadingBarFill = document.getElementById("loading-bar-fill");

    createUnityInstance(canvas, config, function (progress) {
      if (loadingBarFill) loadingBarFill.style.width = (progress * 100) + "%";
    }).then((unityInstance) => {
      window.unityInstance = unityInstance;
      resizeCanvas(); // 起動完了後、念のためもう一度サイズを確定させる(上のセルフヒール参照)

      if (loadingOverlay) {
        loadingOverlay.style.opacity = "0";
        // transition(0.4s)が終わってから完全に取り除く(opacity:0のままだと当たり判定だけ残ってしまうため)
        setTimeout(function () {
          if (loadingOverlay && loadingOverlay.parentNode) loadingOverlay.parentNode.removeChild(loadingOverlay);
        }, 400);
      }
    });
  </script>
</body>
</html>
