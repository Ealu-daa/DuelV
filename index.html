<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>DuelV</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">

  <!-- Firebase SDK (compat版。jslib内のfirebase.xxx記法がそのまま使える) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #unity-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #fullscreen-button {
      position: fixed;
      right: 12px;
      bottom: 12px;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: none;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 20px;
      line-height: 40px;
      text-align: center;
      padding: 0;
      z-index: 100;
      cursor: pointer;
      /* スマホでタップ時にハイライト色が付くのを防ぐ */
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
  </div>
  <button id="fullscreen-button" type="button" aria-label="フルスクリーン切り替え">⛶</button>
  <script src="Build/b.1.loader.js"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");

    // 実解像度をウィンドウサイズに追従させる(見た目だけCSSで伸ばすとぼやけるため)
    function resizeCanvas() {
      var dpr = window.devicePixelRatio || 1;
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
    }
    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    // フルスクリーン切り替え(ブラウザの仕様上、ユーザー操作がないと呼び出せないためボタン経由にしている)。
    // ベンダープレフィックス付きAPI(Safari等)にも対応
    var fullscreenTarget = document.getElementById("unity-container");
    var fullscreenButton = document.getElementById("fullscreen-button");

    function isFullscreen() {
      return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
    }

    function requestFullscreen(el) {
      if (el.requestFullscreen) return el.requestFullscreen();
      if (el.webkitRequestFullscreen) return el.webkitRequestFullscreen(); // Safari
      if (el.msRequestFullscreen) return el.msRequestFullscreen();         // 旧Edge/IE
    }

    function exitFullscreen() {
      if (document.exitFullscreen) return document.exitFullscreen();
      if (document.webkitExitFullscreen) return document.webkitExitFullscreen();
      if (document.msExitFullscreen) return document.msExitFullscreen();
    }

    if (fullscreenButton) {
      // iOS Safari(特に旧バージョン)はFullscreen API自体に対応していない場合があるため、
      // 非対応環境ではボタンごと隠す
      var supportsFullscreen = !!(fullscreenTarget.requestFullscreen || fullscreenTarget.webkitRequestFullscreen || fullscreenTarget.msRequestFullscreen);
      if (!supportsFullscreen) {
        fullscreenButton.style.display = "none";
      } else {
        fullscreenButton.addEventListener("click", function () {
          if (isFullscreen()) {
            exitFullscreen();
          } else {
            requestFullscreen(fullscreenTarget);
          }
        });

        var updateButtonLabel = function () {
          fullscreenButton.textContent = isFullscreen() ? "⤢" : "⛶";
        };
        document.addEventListener("fullscreenchange", updateButtonLabel);
        document.addEventListener("webkitfullscreenchange", updateButtonLabel);
        document.addEventListener("msfullscreenchange", updateButtonLabel);
      }
    }

    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/b.1.data",
      frameworkUrl: buildUrl + "/b.1.framework.js",
      codeUrl: buildUrl + "/b.1.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "DuelV",
      productVersion: "b.1",
    };

    createUnityInstance(canvas, config).then((unityInstance) => {
      window.unityInstance = unityInstance;
    });
  </script>
</body>
</html>
